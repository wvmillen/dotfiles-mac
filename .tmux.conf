
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# --- PREFIX ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- PANE NAVIGATION ---
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# --- SPLIT PANES (reliable keys) ---
bind | split-window -h    # vertical split
bind - split-window -v    # horizontal split

# --- CLOSE ---
bind w kill-pane
bind x kill-window

# --- TABS ---
bind [ previous-window
bind ] next-window
bind t new-window
bind -n C-t choose-window

bind u copy-mode

set -g mouse on
setw -g mode-keys vi


# --- STATUS BAR STYLING ---
set-option -g status-justify left
set-option -g status-position top
set -g base-index 1
set -g pane-base-index 0

# Length of tmux status line
set -g status-left-length 30
set -g status-right-length 150

set-option -g status "on"

# Default statusbar color
set-option -g status-style bg=default,fg=colour223

# Default window title colors
set-window-option -g window-status-style bg=default,fg=colour244

# Default window with an activity alert
set-window-option -g window-status-activity-style bg=colour237,fg=colour248 # bg=bg1, fg=fg3

# Active window title colors
set-window-option -g window-status-current-style bg=colour255,fg=colour232,bold

# Set active pane border color
set-option -g pane-active-border-style fg=#F0EAD6

# Set inactive pane border color
set-option -g pane-border-style fg=colour239

# Message info
set-option -g message-style bg=colour239,fg=colour223 # bg=bg2, fg=fg1

# Writing commands inactive
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1

# Pane number display
set-option -g display-panes-active-colour colour1 #fg2
set-option -g display-panes-colour colour237 #bg1

# Clock
set-window-option -g clock-mode-colour colour109 #blue

# Bell
set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg

set-option -g status-left "#[bg=default]#{?client_prefix,#[fg=colour75]#[bold],#[fg=colour244]#[nobold]} #S #[fg=colour244]#[nobold]│ "

set-option -g status-right ""

set-window-option -g window-status-current-format "#[bg=colour255,fg=colour232,bold] #I* #W #[bg=default,fg=colour244,nobold]"

set-window-option -g window-status-format "#[bg=default,fg=colour244] #I #W "

# Set the history limit so we get lots of scrollback.
setw -g history-limit 50000000
